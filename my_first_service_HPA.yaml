apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-nodeport
  labels:
    app: nginx-service-nodeport
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-service-nodeport
  template:
    metadata:
      labels:
        app: nginx-service-nodeport
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
        resources:
          # NOTE: Guaranteed pods require requests and limits to be EXACTLY EQUAL
          # Lowered to 100m so your cluster can easily handle scaling up to 10 replicas.
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-nodeport
spec:
  type: NodePort
  selector:
    app: nginx-service-nodeport
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-deployment-nodeport-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment-nodeport
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 100Mi
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # Still evaluates load instantly
      policies:
      - type: Pods
        value: 1                     # Limit scaling increment to exactly 1 Pod...
        periodSeconds: 30            # ...every 30 seconds.
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60 # Cools down quickly (1 min) for rapid testing