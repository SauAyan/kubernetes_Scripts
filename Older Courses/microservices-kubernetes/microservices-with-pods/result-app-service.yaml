apiVersion: v1 # API version defines the version of the Kubernetes resource
kind: Service # This resource is a service-nodeport
metadata: # Metadata contains data that helps uniquely identify the object
  name: results-service # Name of the service-nodeport
  labels: # Labels are key/value pairs that are attached to objects
    name: results-service
    app: demo-voting-app
spec: # Spec defines the desired state of the object
  type: NodePort
  ports:
    - port: 80 # Port of the Service
      targetPort: 80 # Target port on the POD  
      nodePort: 30005       
  selector: # Meta data of POD. get this from template of deployment or replica set. Use value in the matchLabels part
    name: result-app-pod-nodejs
    app: demo-voting-app
