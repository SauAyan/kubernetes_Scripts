apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-app
        image: <docker username>/order-service:v1
        imagePullPolicy: Always
        
        # Inject all entries from the ConfigMap as environment variables
        envFrom:
        - configMapRef:
            name: order-service-config
            
        ports:
        - containerPort: 9090
          name: http-port

---
apiVersion: v1
kind: Service
metadata:
  name: order-service-svc
  namespace: learning
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 80         # Port exposed inside the cluster
      targetPort: 9090 # Forwards traffic to APP_PORT (9090)